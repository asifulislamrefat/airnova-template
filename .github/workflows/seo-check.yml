name: SEO regression check

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to scrape"
        required: false
        default: "https://airnova-template.lovable.app"
      blog_slugs:
        description: "Comma-separated blog slugs to sample"
        required: false
        default: "how-to-create-content-that-actually-converts,where-creativity-meets-strategy,explore-the-future-of-digital-design"
      lh_seo_min:
        description: "Lighthouse SEO minimum score (0-1)"
        required: false
        default: "0.9"
      lh_perf_min:
        description: "Lighthouse performance minimum score (0-1)"
        required: false
        default: "0.7"
      lh_best_min:
        description: "Lighthouse best-practices minimum score (0-1)"
        required: false
        default: "0.85"
      lh_a11y_min:
        description: "Lighthouse accessibility minimum score (0-1)"
        required: false
        default: "0.85"
      lh_mobile_perf_min:
        description: "Lighthouse MOBILE performance minimum score (0-1)"
        required: false
        default: "0.6"
      lh_mobile_seo_min:
        description: "Lighthouse MOBILE SEO minimum score (0-1)"
        required: false
        default: "0.9"
  schedule:
    - cron: "0 6 * * *"

jobs:
  scrape:
    # On deployment_status, only run for successful deployments.
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      # Repository Variables (Settings → Secrets and variables → Actions → Variables)
      # override these defaults; workflow_dispatch inputs override both.
      SEO_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.target_url || vars.SEO_BASE_URL || 'https://airnova-template.lovable.app' }}
      SEO_BLOG_SLUGS: ${{ inputs.blog_slugs || vars.SEO_BLOG_SLUGS || 'how-to-create-content-that-actually-converts,where-creativity-meets-strategy,explore-the-future-of-digital-design' }}
      SEO_BLOG_SAMPLE: ${{ vars.SEO_BLOG_SAMPLE || inputs.blog_slugs || 'how-to-create-content-that-actually-converts,where-creativity-meets-strategy,explore-the-future-of-digital-design' }}
      SEO_USE_REMOTE_VALIDATOR: ${{ vars.SEO_USE_REMOTE_VALIDATOR || '1' }}
      LH_SEO_MIN: ${{ inputs.lh_seo_min || vars.LH_SEO_MIN || '0.9' }}
      LH_PERF_MIN: ${{ inputs.lh_perf_min || vars.LH_PERF_MIN || '0.7' }}
      LH_BEST_MIN: ${{ inputs.lh_best_min || vars.LH_BEST_MIN || '0.85' }}
      LH_A11Y_MIN: ${{ inputs.lh_a11y_min || vars.LH_A11Y_MIN || '0.85' }}
      LH_REPORT_DIR: lighthouse-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run SEO check
        run: node scripts/seo-check.mjs
      - name: Validate blog JSON-LD structured data
        run: node scripts/validate-jsonld.mjs
      - name: Install Lighthouse
        run: npm install --no-save --no-audit --no-fund lighthouse@12 chrome-launcher@1
      - name: Lighthouse (desktop) — SEO + structured data thresholds
        env:
          LH_FORM_FACTOR: desktop
        run: node scripts/lighthouse-check.mjs
      - name: Lighthouse (mobile) — emulated Moto G Power, Slow 4G
        env:
          LH_FORM_FACTOR: mobile
          # Mobile thresholds are deliberately a bit looser than desktop —
          # throttling makes raw perf numbers lower. SEO/structured-data
          # signals should still be just as strict.
          LH_PERF_MIN: ${{ inputs.lh_mobile_perf_min || vars.LH_MOBILE_PERF_MIN || '0.6' }}
          LH_SEO_MIN: ${{ inputs.lh_mobile_seo_min || vars.LH_MOBILE_SEO_MIN || '0.9' }}
        run: node scripts/lighthouse-check.mjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14